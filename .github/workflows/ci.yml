# Lint, types, unit tests and the protocol check on every push (DEC-022). No AWS credentials:
# acceptance and smoke run against the deployed stack, locally and in the autopilot.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Some script tests make throwaway commits in temporary repos.
      GIT_AUTHOR_NAME: CI
      GIT_AUTHOR_EMAIL: ci@example.com
      GIT_COMMITTER_NAME: CI
      GIT_COMMITTER_EMAIL: ci@example.com
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # check:spec reads the trailers of every commit
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:spec
