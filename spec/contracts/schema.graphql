# Contrato de la API Pedidos B2B (fuente única; la infra lo carga desde aquí, DEC-005).
# Autorización: Cognito User Pool, por campo según el grupo (DEC-004, DEC-013): `almaceneros` opera
# sobre sus pedidos y el catálogo; `distribuidores` ve y cambia el estado de todos los pedidos.
# Todo campo raíz declara su grupo (infra/test lo exige). Montos: Int en pesos CLP (DEC-006).
# Forma de pedidos: DEC-009.

type Product @aws_auth(cognito_groups: ["almaceneros"]) {
  productId: ID!
  name: String!
  presentation: String!
  unitPrice: Int!
}

"Estados del pedido (S-04); uno nuevo nace en RECIBIDO."
enum OrderStatus {
  RECIBIDO
  EN_PREPARACION
  ENVIADO
  ENTREGADO
  CANCELADO
}

type Order @aws_auth(cognito_groups: ["almaceneros", "distribuidores"]) {
  "ULID (DEC-006)."
  id: ID!
  "Almacén dueño del pedido (DEC-004); el panel lo muestra como almacén (S-23)."
  customerId: ID!
  "Últimos 8 caracteres del ULID en mayúsculas (S-11)."
  number: String!
  createdAt: AWSDateTime!
  total: Int!
  status: OrderStatus!
  lines: [OrderLine!]!
}

"Línea con nombre, presentación y precio congelados al confirmar."
type OrderLine @aws_auth(cognito_groups: ["almaceneros", "distribuidores"]) {
  productId: ID!
  name: String!
  presentation: String!
  quantity: Int!
  unitPrice: Int!
  subtotal: Int!
}

"Sin campo de precio: el servidor usa el del catálogo (S-12)."
input OrderLineInput {
  productId: ID!
  quantity: Int!
}

input CreateOrderInput {
  lines: [OrderLineInput!]!
}

"Evento del historial de estados de un pedido (REQ-012, DEC-020); `at` lo fija quien publica (S-33)."
type OrderStatusEvent @aws_auth(cognito_groups: ["almaceneros", "distribuidores"]) {
  "ULID del evento: la misma entrega repetida se guarda una sola vez."
  eventId: ID!
  orderId: ID!
  customerId: ID!
  "Estado anterior; null en el evento de creación (RECIBIDO)."
  from: OrderStatus
  to: OrderStatus!
  at: AWSDateTime!
}

type Query {
  "Productos activos ordenados por nombre (REQ-002)."
  listProducts: [Product!]! @aws_auth(cognito_groups: ["almaceneros"])
  "Pedidos del cliente del token, del más reciente al más antiguo (REQ-004)."
  myOrders: [Order!]! @aws_auth(cognito_groups: ["almaceneros"])
  "Pedido del cliente del token; null si no existe o es de otro cliente (REQ-004 E3)."
  order(id: ID!): Order @aws_auth(cognito_groups: ["almaceneros"])
  "Pedidos de todos los almacenes, del más reciente al más antiguo; solo los de `status` si se indica (REQ-010)."
  allOrders(status: OrderStatus): [Order!]! @aws_auth(cognito_groups: ["distribuidores"])
  "Historial del pedido `id`, del más antiguo al más reciente (REQ-012, S-29). Un almacenero solo recibe los eventos de sus pedidos (otro → lista vacía); el distribuidor, los de cualquiera."
  orderHistory(id: ID!): [OrderStatusEvent!]! @aws_auth(cognito_groups: ["almaceneros", "distribuidores"])
}

type Mutation {
  "Confirma un pedido en RECIBIDO con precios del catálogo (REQ-003). Errores: INVALID_QUANTITY, PRODUCT_UNAVAILABLE, EMPTY_ORDER, TOO_MANY_LINES."
  createOrder(input: CreateOrderInput!): Order! @aws_auth(cognito_groups: ["almaceneros"])
  "Cambia solo el estado del pedido `id` del almacén `customerId` (REQ-011). Error: ORDER_NOT_FOUND."
  setOrderStatus(customerId: ID!, id: ID!, status: OrderStatus!): Order! @aws_auth(cognito_groups: ["distribuidores"])
}

schema {
  query: Query
  mutation: Mutation
}
